name: Build

on: workflow_call

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build jar
        run: mvn clean package -DskipTests

      - name: Prepare upload
        run: mkdir staging && cp target/dbgrep-1.0.jar "staging/dbgrep-1.0-$(git rev-parse --short HEAD)-$(date +'%Y%m%d-%H%M%S').jar"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging